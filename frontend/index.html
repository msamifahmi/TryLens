<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <title>TryLens — Coba Kacamata Secara Virtual</title>
    <style>
      body{margin:0}
      .tl-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#F5F7FA;color:#0F172A;font-family:"Plus Jakarta Sans",system-ui,sans-serif;transition:opacity .5s ease,visibility .5s}
      .tl-splash.is-out{opacity:0;visibility:hidden;pointer-events:none}
      .tl-splash__logo{width:min(78vw,360px);height:auto;overflow:visible;animation:tl-sp-in .8s cubic-bezier(.2,.8,.2,1) both}
      .tl-splash__logo text{font-family:"Bebas Neue",Impact,system-ui,sans-serif;letter-spacing:.06em}
      .tl-sp-wave1{animation:tl-sp-slide 2.6s linear infinite}
      .tl-sp-wave2{animation:tl-sp-slide 4.2s linear infinite reverse}
      .tl-sp-rise{animation:tl-sp-rise 3.2s ease-in-out infinite alternate}
      .tl-splash__tag{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#64748B;animation:tl-sp-in .8s .35s cubic-bezier(.2,.8,.2,1) both}
      .tl-splash__bars{display:flex;align-items:center;gap:6px;height:28px;animation:tl-sp-in .8s .5s both}
      .tl-splash__bars i{display:block;width:6px;height:100%;border-radius:3px;background:#2563EB;transform-origin:center;animation:tl-sp-bar 1.1s ease-in-out infinite}
      .tl-splash__bars i:nth-child(2){animation-delay:.1s}.tl-splash__bars i:nth-child(3){animation-delay:.2s}
      .tl-splash__bars i:nth-child(4){animation-delay:.3s}.tl-splash__bars i:nth-child(5){animation-delay:.4s}
      .tl-splash__bars i:nth-child(6){animation-delay:.5s}.tl-splash__bars i:nth-child(7){animation-delay:.6s}
      @keyframes tl-sp-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes tl-sp-slide{to{transform:translateX(-200px)}}
      @keyframes tl-sp-rise{from{transform:translateY(34px)}to{transform:translateY(-34px)}}
      @keyframes tl-sp-bar{0%,100%{transform:scaleY(.25);opacity:.45}50%{transform:scaleY(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){.tl-sp-wave1,.tl-sp-wave2,.tl-sp-rise,.tl-splash__bars i{animation-duration:6s}}
    </style>
  </head>
  <body class="bg-[#F5F7FA]">
    <div id="root"></div>
    <!-- Preloader: tampil sampai aplikasi siap, lalu dihilangkan oleh main.jsx -->
    <div class="tl-splash" id="tl-splash" role="status" aria-live="polite" aria-label="Memuat TryLens">
      <svg class="tl-splash__logo" viewBox="0 0 400 110" aria-hidden="true">
        <defs>
          <clipPath id="tl-sp-clip">
            <text x="200" y="92" text-anchor="middle" font-size="104">TRYLENS</text>
          </clipPath>
        </defs>
        <text x="200" y="92" text-anchor="middle" font-size="104" fill="#DCE3EC">TRYLENS</text>
        <g clip-path="url(#tl-sp-clip)">
          <g class="tl-sp-rise">
            <g transform="translate(0,62)">
              <path class="tl-sp-wave2" fill="#93C5FD" d="M0 10 Q50 -8 100 10 T200 10 T300 10 T400 10 T500 10 T600 10 V120 H0Z"/>
              <path class="tl-sp-wave1" fill="#2563EB" d="M0 14 Q50 -4 100 14 T200 14 T300 14 T400 14 T500 14 T600 14 V120 H0Z"/>
            </g>
          </g>
        </g>
      </svg>
      <div class="tl-splash__tag">Coba kacamata secara virtual</div>
      <div class="tl-splash__bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <noscript><p style="text-align:center;font-family:sans-serif;position:fixed;inset:auto 0 24px">Aktifkan JavaScript untuk memakai TryLens.</p></noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
